; PlatformIO project for the 7-DOF arm's stepper motor control firmware.
; Board: Freenove ESP32-S3 WROOM (Basic Starter Kit for ESP32-S3).
; esp32-s3-devkitc-1 is used since Freenove's board follows that same
; standard 44-pin ESP32-S3 devkit layout.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM4
lib_deps =
    waspinator/AccelStepper@^1.64
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
